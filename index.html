<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Unit Economics</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="card">
    <h2>Юнит экономика</h2>
    <input id="name" placeholder="Имя">
    <input id="email" placeholder="Email">
    <button onclick="login()">Войти</button>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">

  <div class="sidebar">

    <div class="profile">
      <div class="avatar" id="avatar">U</div>
      <div class="profile-info">
        <div id="profileName">User</div>
        <div id="profileEmail">email@mail.com</div>
      </div>
    </div>

    <div class="nav">
      <button onclick="showPage('dash')">Dashboard</button>
      <button onclick="showPage('model')">Model</button>
      <button onclick="showPage('analytics')">Analytics</button>
    </div>
  </div>

  <div class="main">

    <div id="dash" class="page active">
      <div class="section">
        <h3>Метрики</h3>
        <div class="metrics">
          <div class="metric">CAC <span id="cac">0 ₽</span></div>
          <div class="metric">LTV <span id="ltv">0 ₽</span></div>
          <div class="metric">ROI <span id="roi">0 ₽</span></div>
          <div class="metric">Paying <span id="paying">0</span></div>
        </div>
      </div>
    </div>

    <div id="model" class="page">
      <div class="section">
        <h3>Модель</h3>
        <input id="marketing" type="number" placeholder="Маркетинг">
        <input id="users" type="number" placeholder="Пользователи">
        <input id="payingUsers" type="number" placeholder="Платящие">
        <input id="revenue" type="number" placeholder="Доход">
        <input id="lifetime" type="number" placeholder="Lifetime">
        <button onclick="calculate()">Рассчитать</button>
      </div>
    </div>

    <div id="analytics" class="page">
      <div class="section">
        <h3>Прогноз прибыли</h3>
        <canvas id="chart"></canvas>
      </div>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
